{% set name = "skops" %}
{% set version = "0.15" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/skops-dev/skops/archive/v{{ version }}.tar.gz
  sha256: 74a4d5952332d7071834535b3f71f595e3ceba39a6a5785cad91524b2be80ad8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - numpy >=1.25.0
    - scipy >=1.10.0
    - scikit-learn >=1.2
    - prettytable >=3.9
    - packaging >=17.0

test:
  imports:
    - skops
  commands:
    - pip check
  requires:
    - python
    - pip

about:
  home: http://github.com/skops-dev/skops
  summary: A set of tools, related to machine learning in production.
  license: MIT
  license_file: LICENSE
  doc_url: http://github.com/skops-dev/skops
  dev_url: http://github.com/skops-dev/skops

extra:
  recipe-maintainers:
    - sugatoray
    # maintainers from upstream repo
    - adrinjalali
